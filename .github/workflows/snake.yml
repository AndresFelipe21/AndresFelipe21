name: Generate Snake

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Generate snake files
        uses: Platane/snk@v3
        with:
          github_user_name: AndresFelipe21
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push to output branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/snake
          cp dist/*.svg /tmp/snake/
          git checkout --orphan output
          git rm -rf . || true
          cp /tmp/snake/*.svg ./
          git add github-contribution-grid-snake.svg github-contribution-grid-snake-dark.svg
          git commit -m "Generate contribution snake" || echo "nothing to commit"
          git push origin output --force
